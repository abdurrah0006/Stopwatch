<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Stopwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <span class="mode-icon">☀️</span>
    </button>

    <main class="stopwatch-container">
        <div class="display-wrapper">
            <span id="display">00:00:00<span class="ms">.000</span></span>
        </div>

        <div class="controls-row">
            <button id="start-stop-btn" class="btn btn-start">Start</button>
            <button id="lap-btn" class="btn btn-lap" disabled>Lap</button>
            <button id="reset-btn" class="btn btn-reset">Reset</button>
        </div>

        <div class="laps-box">
            <ul id="laps-list"></ul>
        </div>
    </main>

    <footer class="footer">
        <p>by Abdur Rahman</p>
    </footer>
  
    <script src="./assets/js/main.js"></script>
</body>
</html>
